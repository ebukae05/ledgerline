[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ledgerline"
version = "0.1.0"
description = "Card transaction fraud scoring and merchant descriptor categorization, served through a tested API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

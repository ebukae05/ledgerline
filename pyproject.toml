[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ledgerline"
version = "0.1.0"
description = "Card transaction fraud scoring and merchant descriptor categorization, served through a tested API."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.142.2",
    "polars==1.44.2",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
    "uvicorn[standard]==0.54.0",
    "pyarrow==25.0.1",
    "python-dotenv==1.2.3",
    "google-genai==2.26.0",
    "lightgbm==4.7.0",
    "scikit-learn==1.9.1",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.16.9",
    "pre-commit==4.6.2",
]
notebooks = [
    "ipykernel==7.4.0",
    "matplotlib==3.11.2",
    "nbconvert==7.17.1",
    "nbformat==5.11.1",
    "numpy==2.5.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# Keep the ruff version here in sync with pyproject.toml so the hook and CI agree.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --fix
        language: python
        additional_dependencies: [ruff==0.16.9]
        types_or: [python, jupyter]
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: python
        additional_dependencies: [ruff==0.16.9]
        types_or: [python, jupyter]
